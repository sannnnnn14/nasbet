<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apex Royale Admin</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: #07090e; color: #fff; font-family: sans-serif; padding: 2rem; }
    h1 { color: #f59e0b; margin-bottom: 2rem; }
    table { width: 100%; border-collapse: collapse; background: #111827; border-radius: 12px; overflow: hidden; }
    th, td { padding: 1rem; border-bottom: 1px solid #1f2937; text-align: left; }
    th { background: #1f2937; color: #f59e0b; }
    .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .approve { background: #10b981; color: #000; }
    .decline { background: #ef4444; color: #fff; }
  </style>
</head>
<body>
  <h1>Admin Deposit Approvals</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>User</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

<script>
  const socket = io();
  socket.emit('admin_init');

  socket.on('update_deposits', deposits => {
    const tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    deposits.forEach(d => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${d.id}</td>
        <td>${d.username}</td>
        <td>$${d.amount.toFixed(2)}</td>
        <td><strong style="color:${d.status === 'approved' ? '#10b981' : d.status === 'declined' ? '#ef4444' : '#f59e0b'}">${d.status.toUpperCase()}</strong></td>
        <td>
          ${d.status === 'pending' ? `
            <button class="btn approve" onclick="approve(${d.id})">Approve</button>
            <button class="btn decline" onclick="decline(${d.id})">Decline</button>
          ` : 'Processed'}
        </td>
      `;
      tbody.appendChild(tr);
    });
  });

  function approve(id) { socket.emit('approve_dep', id); }
  function decline(id) { socket.emit('decline_dep', id); }
</script>
</body>
</html>
