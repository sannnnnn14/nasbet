<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROYALSPIN | Roulette</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0a0e17;
      font-family: 'Inter', sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== MOBILE FIRST ===== */
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      background: #0d1421;
      min-height: 100vh;
      position: relative;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #0a0f1a;
      border-bottom: 1px solid #1a2333;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: #d4af37;
      letter-spacing: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .balance-mobile {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      background: #131c2d;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #1a2333;
    }

    .balance-mobile .amount {
      color: #d4af37;
    }

    .profile-trigger {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: #000;
      cursor: pointer;
      border: 2px solid #d4af37;
      flex-shrink: 0;
    }

    /* ===== SIDEBAR OVERLAY (Mobile Menu) ===== */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .sidebar-menu {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100%;
      background: #080c14;
      z-index: 101;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 20px;
      overflow-y: auto;
      border-left: 1px solid #1a2333;
    }

    .sidebar-menu.open {
      right: 0;
    }

    .sidebar-menu .close-btn {
      background: none;
      border: none;
      color: #8a99ad;
      font-size: 1.5rem;
      cursor: pointer;
      float: right;
      padding: 4px 8px;
    }

    .sidebar-menu .profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid #1a2333;
      margin-bottom: 16px;
    }

    .sidebar-menu .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: #000;
    }

    .sidebar-menu .profile-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .sidebar-menu .profile-email {
      font-size: 0.7rem;
      color: #8a99ad;
    }

    .menu-item {
      padding: 12px 14px;
      color: #8a99ad;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .menu-item:hover,
    .menu-item:active {
      background: #131c2d;
      color: #fff;
    }

    .menu-item .icon {
      font-size: 16px;
      width: 24px;
    }

    .menu-item.gold {
      color: #d4af37;
    }

    .menu-item.logout {
      color: #ef4444;
      margin-top: 8px;
      border-top: 1px solid #1a2333;
      padding-top: 16px;
    }

    .vip-card {
      background: #0d1421;
      border: 1px solid #1a2333;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
    }

    .vip-card .vip-title {
      font-size: 0.65rem;
      color: #8a99ad;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .vip-card .vip-stars {
      display: flex;
      gap: 3px;
      margin-bottom: 6px;
    }

    .vip-card .vip-stars span {
      font-size: 16px;
      color: #d4af37;
    }

    .vip-card .vip-stars span.inactive {
      color: #2a3346;
    }

    .vip-card .vip-progress {
      height: 3px;
      background: #1a2333;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .vip-card .vip-progress .fill {
      height: 100%;
      width: 60%;
      background: #d4af37;
      border-radius: 2px;
    }

    .vip-card .vip-claim {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vip-card .vip-claim span {
      font-size: 0.7rem;
      color: #8a99ad;
    }

    .vip-card .vip-claim button {
      background: #d4af37;
      color: #000;
      border: none;
      padding: 4px 14px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.7rem;
      cursor: pointer;
    }

    /* ===== ROULETTE TABLE ===== */
    .table-area {
      padding: 12px 12px 8px 12px;
      background: #0b4f32;
      position: relative;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
    }

    .table-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.3));
      pointer-events: none;
    }

    .wheel-wrapper {
      display: flex;
      justify-content: center;
      padding: 8px 0 4px 0;
      position: relative;
      z-index: 1;
    }

    #roulette-canvas {
      width: 200px;
      height: 200px;
      max-width: 100%;
    }

    .timer-badge {
      position: absolute;
      top: 8px;
      right: 12px;
      background: #1a2638;
      border: 1px solid #2e3e56;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.6rem;
      font-weight: 700;
      color: #38bdf8;
      z-index: 2;
    }

    /* Betting Grid */
    .betting-grid {
      display: grid;
      grid-template-columns: 32px repeat(12, 1fr);
      gap: 2px;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px;
      border-radius: 4px;
      position: relative;
      z-index: 1;
      margin-top: 4px;
    }

    .bet-cell {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.65rem;
      cursor: pointer;
      border-radius: 2px;
      transition: 0.1s;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      -webkit-touch-callout: none;
      user-select: none;
    }

    .bet-cell:active {
      filter: brightness(1.4);
    }

    .bet-cell.red {
      background: #cc1100;
    }
    .bet-cell.black {
      background: #171717;
    }
    .bet-cell.zero {
      grid-row: span 3;
      background: #0f766e;
      font-size: 0.85rem;
    }

    /* Outside Bets */
    .outside-bets {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      margin-top: 4px;
      position: relative;
      z-index: 1;
    }

    .outside-bet {
      height: 28px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s;
      -webkit-touch-callout: none;
      user-select: none;
    }

    .outside-bet:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .outside-bet.red-bg {
      background: #cc1100;
    }
    .outside-bet.black-bg {
      background: #171717;
    }

    /* Chip Badge */
    .chip-badge {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d4af37;
      color: #000;
      font-size: 0.4rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #fff;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    /* ===== CHIP CONTROLS ===== */
    .chip-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #0a0f1a;
      border-top: 1px solid #1a2333;
      flex-wrap: wrap;
      justify-content: center;
    }

    .chip-controls .label {
      font-size: 0.6rem;
      color: #8a99ad;
      font-weight: 600;
      margin-right: 2px;
    }

    .chip {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.55rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      -webkit-touch-callout: none;
      user-select: none;
      flex-shrink: 0;
    }

    .chip:active {
      transform: scale(0.92);
    }

    .chip.active {
      transform: scale(1.12);
      border-color: #d4af37;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.4);
    }

    .chip-1 {
      background: #2563eb;
      color: #fff;
    }
    .chip-5 {
      background: #059669;
      color: #fff;
    }
    .chip-25 {
      background: #d97706;
      color: #fff;
    }
    .chip-100 {
      background: #7c3aed;
      color: #fff;
    }
    .chip-500 {
      background: #dc2626;
      color: #fff;
    }

    .spin-btn {
      background: linear-gradient(180deg, #f3cf65 0%, #a88118 100%);
      color: #000;
      border: none;
      padding: 6px 20px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: 0.15s;
      flex-shrink: 0;
      margin-left: auto;
    }

    .spin-btn:active {
      transform: scale(0.95);
    }

    /* ===== RESPONSIVE BREAKPOINTS ===== */
    @media (min-width: 600px) {
      .app-container {
        max-width: 600px;
      }

      #roulette-canvas {
        width: 260px;
        height: 260px;
      }

      .bet-cell {
        height: 42px;
        font-size: 0.75rem;
      }

      .betting-grid {
        grid-template-columns: 38px repeat(12, 1fr);
      }

      .outside-bet {
        height: 34px;
        font-size: 0.7rem;
      }

      .chip {
        width: 40px;
        height: 40px;
        font-size: 0.7rem;
      }

      .chip-controls {
        padding: 10px 16px;
        gap: 8px;
      }

      .spin-btn {
        padding: 8px 28px;
        font-size: 0.85rem;
      }

      .header {
        padding: 14px 20px;
      }

      .brand {
        font-size: 1.3rem;
      }

      .table-area {
        padding: 16px 16px 10px 16px;
      }

      .timer-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
      }
    }

    @media (min-width: 900px) {
      .app-container {
        max-width: 900px;
        padding: 20px;
        background: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #06090e;
        padding: 20px;
      }

      .app-container {
        background: #0d1421;
        border-radius: 16px;
        border: 1px solid #1a2333;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        min-height: auto;
      }

      #roulette-canvas {
        width: 280px;
        height: 280px;
      }

      .bet-cell {
        height: 44px;
        font-size: 0.8rem;
      }

      .betting-grid {
        grid-template-columns: 40px repeat(12, 1fr);
      }

      .outside-bet {
        height: 36px;
        font-size: 0.75rem;
      }

      .table-area {
        padding: 20px 24px 14px 24px;
      }

      .chip {
        width: 44px;
        height: 44px;
        font-size: 0.75rem;
      }

      .chip-controls {
        padding: 12px 24px;
        gap: 10px;
      }

      .spin-btn {
        padding: 10px 36px;
        font-size: 0.9rem;
      }

      .sidebar-overlay {
        display: none !important;
      }

      .sidebar-menu {
        display: none !important;
      }

      .profile-trigger {
        display: none;
      }

      /* Desktop sidebar shown inline */
      .desktop-sidebar {
        display: block !important;
      }
    }

    /* Desktop sidebar (hidden on mobile) */
    .desktop-sidebar {
      display: none;
      padding: 20px;
      border-left: 1px solid #1a2333;
      min-width: 220px;
      background: #080c14;
    }

    @media (min-width: 900px) {
      .roulette-layout {
        display: flex;
      }
      .table-area {
        flex: 1;
      }
    }

    /* Utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- HEADER -->
    <div class="header">
      <div class="brand">👑 ROYALSPIN</div>
      <div class="header-right">
        <div class="balance-mobile">
          <span style="color:#8a99ad;font-weight:400;">BAL</span>
          <span class="amount">$1,250</span>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR MENU -->
    <div class="sidebar-menu" id="sidebarMenu">

      <div class="profile-header">
        <div class="profile-avatar">JD</div>
        <div>
          <div class="profile-name">John Doe</div>
          <div class="profile-email">john@royalspin.com</div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:2px;">
        <button class="menu-item"><span class="icon">👤</span> My Profile</button>
        <button class="menu-item gold"><span class="icon">💰</span> Deposit</button>
        <button class="menu-item gold"><span class="icon">💳</span> Withdraw</button>
        <button class="menu-item"><span class="icon">📊</span> Bet History</button>
        <button class="menu-item"><span class="icon">🎁</span> Bonuses</button>
        <button class="menu-item gold"><span class="icon">⭐</span> VIP Club</button>
        <button class="menu-item logout"><span class="icon">🚪</span> Logout</button>
      </div>

      <div class="vip-card">
        <div class="vip-title">VIP Status</div>
        <div class="vip-stars">
          <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span class="inactive">⭐</span>
        </div>
        <div class="vip-progress"><div class="fill"></div></div>
        <div class="vip-claim">
          <span>1,250 / 5,000 XP</span>
          <button>CLAIM</button>
        </div>
      </div>
    </div>

    <!-- ROULETTE LAYOUT -->
    <div class="roulette-layout">
      <!-- TABLE AREA -->
      <div class="table-area">

        <div class="wheel-wrapper">
          <canvas id="roulette-canvas" width="280" height="280"></canvas>

        <div class="betting-grid" id="numberGrid">
          <div class="bet-cell zero" onclick="placeBet('zero', 0, this)">0</div>

        <div class="outside-bets">
          <div class="outside-bet" onclick="placeBet('1-18', '1-18', this)">1-18</div>
          <div class="outside-bet" onclick="placeBet('even', 'EVEN', this)">EVEN</div>
          <div class="outside-bet red-bg" onclick="placeBet('red', 'RED', this)">RED</div>
          <div class="outside-bet black-bg" onclick="placeBet('black', 'BLACK', this)">BLACK</div>
          <div class="outside-bet" onclick="placeBet('odd', 'ODD', this)">ODD</div>
          <div class="outside-bet" onclick="placeBet('19-36', '19-36', this)">19-36</div>
        </div>
      </div>

      <!-- DESKTOP SIDEBAR -->
      <div class="desktop-sidebar">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid #1a2333;">
            <div style="width:40px;height:40px;border-radius:50%;background:#d4af37;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#000;">JD</div>
            <div>
              <div style="font-weight:700;font-size:0.9rem;">John Doe</div>
              <div style="font-size:0.65rem;color:#8a99ad;">john@royalspin.com</div>
            </div>
          </div>

          <button class="menu-item"><span class="icon">👤</span> My Profile</button>
          <button class="menu-item gold"><span class="icon">💰</span> Deposit</button>
          <button class="menu-item gold"><span class="icon">💳</span> Withdraw</button>
          <button class="menu-item"><span class="icon">📊</span> Bet History</button>
          <button class="menu-item"><span class="icon">🎁</span> Bonuses</button>
          <button class="menu-item gold"><span class="icon">⭐</span> VIP Club</button>
          <button class="menu-item logout"><span class="icon">🚪</span> Logout</button>

          <div class="vip-card">
            <div class="vip-title">VIP Status</div>
            <div class="vip-stars">
              <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span class="inactive">⭐</span>
            </div>
            <div class="vip-progress"><div class="fill"></div></div>
            <div class="vip-claim">
              <span>1,250 / 5,000 XP</span>

      </div>

    <!-- CHIP CONTROLS -->
    <div class="chip-controls">
      <span class="label">CHIP:</span>
      <div class="chip chip-1 active" onclick="selectChip(1, this)">$1</div>
      <div class="chip chip-5" onclick="selectChip(5, this)">$5</div>
      <div class="chip chip-25" onclick="selectChip(25, this)">$25</div>
      <div class="chip chip-100" onclick="selectChip(100, this)">$100</div>
      <div class="chip chip-500" onclick="selectChip(500, this)">$500</div>
      <button class="spin-btn" onclick="spinWheel()">SPIN</button>
    </div>
  </div>

  <script>
    // ===== TOGGLE SIDEBAR =====
    function toggleSidebar() {
      const overlay = document.getElementById('sidebarOverlay');
      const menu = document.getElementById('sidebarMenu');
      overlay.classList.toggle('active');
      menu.classList.toggle('open');
    }

    // ===== ROULETTE ENGINE =====
    const canvas = document.getElementById('roulette-canvas');
    const ctx = canvas.getContext('2d');

    // Handle canvas sizing
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width || 280;
      canvas.height = rect.height || 280;
      drawWheel();
    }

    const RED_NUMBERS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    const WHEEL_NUMBERS = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];

    let wheelRotation = 0;
    let ballAngle = 0;
    let ballRadius = 0;
    let currentChip = 1;
    let isSpinning = false;
    let timer = 12;

    function getRadius() {
      return Math.min(canvas.width, canvas.height) / 2 - 10;
    }

    function drawWheel() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const r = getRadius();

      ctx.clearRect(0, 0, w, h);

      // Outer
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#2b1704';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 15;
      ctx.fill();

      // Gold ring
      ctx.beginPath();
      ctx.arc(cx, cy, r - 6, 0, Math.PI * 2);
      ctx.fillStyle = '#d4af37';
      ctx.fill();

      const numPockets = WHEEL_NUMBERS.length;
      const sliceAngle = (Math.PI * 2) / numPockets;
      const pocketRadius = r - 12;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(wheelRotation);

      for (let i = 0; i < numPockets; i++) {
        const angle = i * sliceAngle;
        const num = WHEEL_NUMBERS[i];

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, pocketRadius, angle, angle + sliceAngle);

        if (num === 0) ctx.fillStyle = '#0f766e';
        else if (RED_NUMBERS.includes(num)) ctx.fillStyle = '#cc1100';
        else ctx.fillStyle = '#171717';

        ctx.fill();
        ctx.strokeStyle = 'rgba(212, 175, 55, 0.25)';
        ctx.stroke();

        ctx.save();
        ctx.rotate(angle + sliceAngle / 2);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(8, r * 0.065)}px Inter`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(num, pocketRadius - r * 0.18, 0);
        ctx.restore();
      }

      // Center
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.28);
      grad.addColorStop(0, '#fef08a');
      grad.addColorStop(1, '#a88118');
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();

      // Ball
      ctx.save();
      ctx.translate(cx, cy);
      const bx = Math.cos(ballAngle) * ballRadius;
      const by = Math.sin(ballAngle) * ballRadius;
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(bx, by, Math.max(4, r * 0.035), 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.restore();

      ctx.shadowBlur = 0;
    }

    // Build number grid
    const grid = document.getElementById('numberGrid');
    for (let row = 3; row >= 1; row--) {
      for (let col = 1; col <= 12; col++) {
        const num = (col - 1) * 3 + row;
        const cell = document.createElement('div');
        cell.className = `bet-cell ${RED_NUMBERS.includes(num) ? 'red' : 'black'}`;
        cell.textContent = num;
        cell.onclick = () => placeBet('number', num, cell);
        grid.appendChild(cell);
      }
    }

    function selectChip(value, el) {
      currentChip = value;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }

    function placeBet(type, target, el) {
      if (isSpinning) return;
      const chip = document.createElement('div');
      chip.className = 'chip-badge';
      chip.textContent = `$${currentChip}`;
      chip.style.left = (Math.random() * 20 + 10) + '%';
      chip.style.top = (Math.random() * 20 + 10) + '%';
      el.style.position = 'relative';
      el.appendChild(chip);
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;

      const startTime = performance.now();
      const duration = 4500 + Math.random() * 2500;
      const startRotation = wheelRotation;
      const targetRotation = startRotation + (Math.PI * 2 * (4 + Math.random() * 5));

      function animate(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);

        wheelRotation = startRotation + (targetRotation - startRotation) * easeOut;

        const r = getRadius();
        if (progress > 0.4) {
          ballRadius = r * 0.82 - (r * 0.45 * ((progress - 0.4) / 0.6));
        } else {
          ballRadius = r * 0.82;
        }
        ballAngle -= 0.12 * (1 - easeOut * 0.7);

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          const resultIndex = Math.floor(((wheelRotation % (Math.PI * 2)) / (Math.PI * 2)) * WHEEL_NUMBERS.length);
          const winningNumber = WHEEL_NUMBERS[resultIndex % WHEEL_NUMBERS.length];
          setTimeout(() => {
            alert(`🎰 WINNING NUMBER: ${winningNumber}`);
            document.querySelectorAll('.chip-badge').forEach(c => c.remove());
          }, 300);
        }
      }
      requestAnimationFrame(animate);
    }

    // Timer
    setInterval(() => {
      timer = timer > 0 ? timer - 1 : 12;
      document.getElementById('timerDisplay').textContent = timer;
    }, 1000);

    // Resize handler
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      setTimeout(resizeCanvas, 50);
    });

    // Initial draw
    resizeCanvas();

    // Close sidebar on escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const overlay = document.getElementById('sidebarOverlay');
        const menu = document.getElementById('sidebarMenu');
        overlay.classList.remove('active');
        menu.classList.remove('open');
      }
    });
  </script>

</body>
</html>
