<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apex Royale | Luxury Online Casino</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Auth Modal -->
<div id="auth-modal" class="modal">
  <div class="modal-card">
    <h2 class="brand">APEX ROYALE</h2>
    <p style="color: #94a3b8; margin-bottom: 1rem;">Login or Register to Play</p>
    <input type="text" id="auth-user" placeholder="Username">
    <input type="password" id="auth-pass" placeholder="Password">
    <div style="display: flex; gap: 10px; margin-top: 1rem;">
      <button class="btn-gold" style="flex:1" onclick="handleAuth('login')">Login</button>
      <button class="btn-gold" style="flex:1" onclick="handleAuth('register')">Register</button>
    </div>
  </div>
</div>

<header>
  <div class="brand">APEX ROYALE</div>
  <div class="wallet">
    <span>Player: <strong id="user-display">--</strong></span>
    <span>Balance: $<strong id="balance-display" style="color: var(--gold);">0.00</strong></span>
    <button class="btn-gold" onclick="requestDeposit()">Deposit</button>
  </div>
</header>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="switchTab('roulette')">🎰 Live Roulette</button>
  <button class="tab-btn" onclick="switchTab('slots')">🎰 VIP Slots</button>
  <button class="tab-btn" onclick="switchTab('crash')">🚀 Crash Game</button>
</div>

<!-- ROULETTE TAB -->
<div id="roulette-page" class="page active">
  <div class="roulette-wrapper">
    <div class="wheel-hostess-container">
      <div class="hostess-card">
        <h3 style="color:var(--gold);">Live Dealer</h3>
        <p>European VIP Table #1</p>
      </div>
      <div style="position: relative;">
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
      </div>
    </div>

    <!-- Interactive Chip Selection -->
    <div class="chip-bar">
      <div class="chip chip-1 selected" onclick="selectChip(1, this)">$1</div>
      <div class="chip chip-5" onclick="selectChip(5, this)">$5</div>
      <div class="chip chip-25" onclick="selectChip(25, this)">$25</div>
      <div class="chip chip-100" onclick="selectChip(100, this)">$100</div>
      <div class="chip chip-500" onclick="selectChip(500, this)">$500</div>
    </div>

    <!-- 1xBet Table Felt Layout -->
    <div class="table-felt">
      <div class="betting-grid" id="number-grid">
        <div class="bet-cell zero" onclick="placeBet('number', 0, this)">0</div>
      </div>
      <div class="outside-grid">
        <div class="outside-cell" onclick="placeBet('red', 'RED', this)">RED</div>
        <div class="outside-cell" onclick="placeBet('black', 'BLACK', this)">BLACK</div>
        <div class="outside-cell" onclick="placeBet('even', 'EVEN', this)">EVEN</div>
        <div class="outside-cell" onclick="placeBet('odd', 'ODD', this)">ODD</div>
      </div>
    </div>

    <button class="btn-gold" style="font-size: 1.2rem; width: 300px;" onclick="spinRoulette()">SPIN WHEEL</button>
  </div>
</div>

<!-- SLOTS TAB -->
<div id="slots-page" class="page">
  <div class="slots-container">
    <h2 style="color:var(--gold);">VIP Diamond Slots</h2>
    <div class="reels">
      <div class="reel" id="r1">💎</div>
      <div class="reel" id="r2">💎</div>
      <div class="reel" id="r3">💎</div>
    </div>
    <div style="margin-bottom: 1.5rem;">
      <label>Bet Amount: $</label>
      <input type="number" id="slot-bet" value="10" style="padding: 0.5rem; width: 100px; background: #000; color: #fff; border: 1px solid var(--gold); border-radius: 6px;">
    </div>
    <button class="btn-gold" onclick="spinSlots()">SPIN SLOTS</button>
  </div>
</div>

<!-- CRASH TAB -->
<div id="crash-page" class="page">
  <div class="slots-container">
    <h2 style="color:var(--gold);">Space Crash</h2>
    <div style="font-size: 4rem; font-weight: 800; color: var(--gold); margin: 2rem 0;" id="crash-mult">1.00x</div>
    <p>Multiplayer Engine Syncing...</p>
  </div>
</div>

<script>
const socket = io();
let selectedChipValue = 1;
let currentWheelAngle = 0;
let isSpinning = false;

const ROULETTE_NUMBERS = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
const RED_NUMBERS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

// Authenticate on Load
const token = localStorage.getItem('casino_token');
if (token) socket.emit('auth', token);

async function handleAuth(type) {
  const user = document.getElementById('auth-user').value;
  const pass = document.getElementById('auth-pass').value;

  const res = await fetch(`/api/${type}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ username: user, password: pass })
  });

  const data = await res.json();
  if (data.error) return alert(data.error);

  localStorage.setItem('casino_token', data.token);
  document.getElementById('auth-modal').style.display = 'none';
  socket.emit('auth', data.token);
}

socket.on('user_state', u => {
  document.getElementById('auth-modal').style.display = 'none';
  document.getElementById('user-display').innerText = u.username;
  document.getElementById('balance-display').innerText = u.balance.toFixed(2);
});

socket.on('balance_update', bal => document.getElementById('balance-display').innerText = bal.toFixed(2));
socket.on('err_msg', m => alert(m));
socket.on('dep_notice', m => alert(m));

// Generate 1xBet Grid Numbers
const numGrid = document.getElementById('number-grid');
for (let i = 1; i <= 36; i++) {
  const cell = document.createElement('div');
  cell.className = `bet-cell ${RED_NUMBERS.includes(i) ? 'red' : 'black'}`;
  cell.innerText = i;
  cell.onclick = () => placeBet('number', i, cell);
  numGrid.appendChild(cell);
}

function selectChip(val, el) {
  selectedChipValue = val;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

function placeBet(type, target, element) {
  socket.emit('roulette_bet', { type, target, amount: selectedChipValue });
  const chip = document.createElement('div');
  chip.className = 'placed-chip';
  chip.innerText = `$${selectedChipValue}`;
  element.appendChild(chip);
}

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`${tab}-page`).classList.add('active');
  event.target.classList.add('active');
}

// 3D Roulette Canvas Renderer
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');

function drawWheel(angle, ballAngle, ballRad) {
  const cx = 200, cy = 200, r = 180;
  ctx.clearRect(0, 0, 400, 400);

  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#d4af37'; ctx.fill();

  const slice = (Math.PI * 2) / ROULETTE_NUMBERS.length;
  for (let i = 0; i < ROULETTE_NUMBERS.length; i++) {
    const a = angle + i * slice;
    const num = ROULETTE_NUMBERS[i];
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r - 20, a, a + slice);
    ctx.fillStyle = num === 0 ? '#16a34a' : RED_NUMBERS.includes(num) ? '#dc2626' : '#1f2937';
    ctx.fill(); ctx.stroke();

    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a + slice / 2);
    ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 12px Poppins";
    ctx.fillText(num, r - 28, 4); ctx.restore();
  }

  // Ball Render
  if (ballRad > 0) {
    const bx = cx + Math.cos(ballAngle) * ballRad;
    const by = cy + Math.sin(ballAngle) * ballRad;
    ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 8; ctx.shadowColor = '#fff'; ctx.fill(); ctx.shadowBlur = 0;
  }
}

function spinRoulette() {
  if (!isSpinning) socket.emit('roulette_spin');
}

socket.on('roulette_start_spin', data => {
  isSpinning = true;
  const targetIndex = data.winningIndex;
  const slice = (Math.PI * 2) / 37;
  const targetAngle = (Math.PI * 2) - (targetIndex * slice) - (slice / 2);

  const start = performance.now();
  const duration = 8000;

  function frame(now) {
    const progress = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);

    currentWheelAngle = (12 * Math.PI * 2 + targetAngle) * ease;
    const ballAngle = -(18 * Math.PI * 2 * ease);
    const ballRad = 160 - (65 * ease);

    drawWheel(currentWheelAngle, ballAngle, ballRad);

    if (progress < 1) requestAnimationFrame(frame);
    else isSpinning = false;
  }
  requestAnimationFrame(frame);
});

socket.on('roulette_result', res => {
  setTimeout(() => {
    alert(`Winning Number: ${res.winningNumber} (${res.isRed ? 'RED' : 'BLACK'}) | Total Won: $${res.payout}`);
    document.querySelectorAll('.placed-chip').forEach(c => c.remove());
  }, 400);
});

// Slots Execution
function spinSlots() {
  const bet = document.getElementById('slot-bet').value;
  socket.emit('slots_spin', { bet });
}

socket.on('slots_result', data => {
  document.getElementById('r1').innerText = data.reels[0];
  document.getElementById('r2').innerText = data.reels[1];
  document.getElementById('r3').innerText = data.reels[2];
  document.getElementById('balance-display').innerText = data.balance.toFixed(2);
  if (data.payout > 0) alert(`BIG WIN! Won $${data.payout}`);
});

function requestDeposit() {
  const amount = prompt("Enter Deposit Amount ($):");
  if (amount && amount > 0) socket.emit('request_deposit', { amount });
}

drawWheel(0, 0, 0);
</script>
</body>
</html>
