<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classic Tabletop Arcade Roulette</title>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    body, html {
      width: 100%; height: 100%; overflow: hidden; background: #2d050c;
      font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center;
    }

    /* RED DAMASK CASINO CARPET BACKGROUND */
    .game-wrapper {
      width: 100vw; height: 100vh;
      background: radial-gradient(circle, #5e0c18 0%, #1a0206 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
    }

    /* FULLSCREEN BUTTON FOR MOBILE & DESKTOP */
    .fs-btn {
      position: absolute; top: 12px; right: 12px; z-index: 50;
      background: rgba(0,0,0,0.6); border: 2px solid #eab308; color: #eab308;
      padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 900; cursor: pointer;
    }

    /* CAPSULE FELT TABLE (MATCHING IMAGE #3) */
    .felt-table {
      width: 95%; max-width: 1050px; height: 82vh; max-height: 520px;
      background: linear-gradient(180deg, #0c6338 0%, #06381f 100%);
      border: 14px solid #82531e;
      outline: 4px solid #2e1a06;
      border-radius: 260px 180px 180px 260px;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.9);
      position: relative; display: flex; align-items: center; padding: 10px 20px;
    }

    /* ROULETTE WHEEL EMBEDDED ON THE LEFT */
    .wheel-container {
      width: 320px; height: 320px; flex-shrink: 0; position: relative;
      background: #42250c; border-radius: 50%; padding: 8px;
      box-shadow: inset 0 0 20px #000, 0 10px 25px rgba(0,0,0,0.8);
    }
    #roulette-canvas { width: 100%; height: 100%; border-radius: 50%; }

    /* RIGHT SIDE: HUD + BETTING TABLE GRID */
    .table-right { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-left: 15px; }

    /* HUD BALANCE BOX (EXACT MATCH FOR IMAGE #3) */
    .hud-panel {
      background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px; padding: 6px 20px; text-align: center; margin-bottom: 12px; min-width: 280px;
    }
    .hud-title { color: #fff; font-size: 0.9rem; font-weight: 900; letter-spacing: 1px; }
    .hud-balance { color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 2px; }
    .hud-stats { display: flex; justify-content: space-around; color: #cbd5e1; font-size: 0.75rem; font-weight: 800; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 2px; }

    /* GRID TABLE */
    .betting-grid { display: flex; flex-direction: column; gap: 2px; background: #fff; padding: 2px; border-radius: 4px; border: 2px solid #fff; }
    .grid-row { display: flex; gap: 2px; }
    .cell {
      background: #094727; color: #fff; font-size: 0.8rem; font-weight: 900;
      display: flex; justify-content: center; align-items: center; cursor: pointer;
      position: relative; border: 1px solid rgba(255,255,255,0.2);
    }
    .cell:active { filter: brightness(1.4); }
    .cell.num { width: 34px; height: 32px; }
    .cell.red { background: #b91c1c; }
    .cell.black { background: #111827; }
    .cell.zero { width: 30px; height: 98px; background: #047857; }
    .cell.doz { height: 26px; width: 138px; background: #064e2b; font-size: 0.7rem; }
    .cell.outside { height: 26px; width: 68px; background: #064e2b; font-size: 0.65rem; }

    /* CHIP RACK AT BOTTOM OF FELT */
    .chip-rack { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
    .chip {
      width: 38px; height: 38px; border-radius: 50%; border: 3px dashed #fff;
      display: flex; justify-content: center; align-items: center; font-size: 0.7rem; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.6); transition: transform 0.1s;
    }
    .chip.selected { transform: scale(1.2) translateY(-4px); border-style: solid; box-shadow: 0 0 12px #fde047; }
    .chip-100 { background: #16a34a; color: #fff; }
    .chip-50 { background: #dc2626; color: #fff; }
    .chip-500 { background: #2563eb; color: #fff; }
    .chip-1000 { background: #9333ea; color: #fff; }
    .chip-5000 { background: #1f2937; color: #fde047; }

    /* ACTION BUTTON BAR (MATCHING IMAGE #3 BOTTOM ROW) */
    .action-bar { display: flex; gap: 20px; margin-top: 12px; width: 90%; max-width: 800px; justify-content: space-between; }
    .arc-btn {
      padding: 10px 28px; border-radius: 20px; font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem;
      color: #fff; text-shadow: 0 2px 4px #000; border: 2px solid #fff; cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.4), 0 8px 15px rgba(0,0,0,0.5); transition: 0.1s;
    }
    .arc-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }
    .btn-spin { background: linear-gradient(180deg, #22c55e 0%, #15803d 100%); }
    .btn-clear { background: linear-gradient(180deg, #eab308 0%, #a16207 100%); }
    .btn-lobby { background: linear-gradient(180deg, #f97316 0%, #c2410c 100%); }

    .placed-chip {
      position: absolute; width: 20px; height: 20px; background: #fde047; color: #000;
      border-radius: 50%; border: 1.5px solid #000; font-size: 0.55rem; font-weight: 900;
      display: flex; justify-content: center; align-items: center; z-index: 10; pointer-events: none;
    }

    /* MOBILE LANDSCAPE FORCING & RESPONSIVENESS */
    @media (max-width: 850px) {
      .felt-table { border-radius: 40px; height: 90vh; padding: 5px; }
      .wheel-container { width: 180px; height: 180px; }
      .cell.num { width: 22px; height: 22px; font-size: 0.65rem; }
      .cell.zero { width: 20px; height: 68px; }
      .cell.doz { width: 88px; height: 20px; font-size: 0.6rem; }
      .cell.outside { width: 43px; height: 20px; font-size: 0.5rem; }
      .chip { width: 28px; height: 28px; font-size: 0.55rem; }
      .arc-btn { font-size: 1.1rem; padding: 6px 16px; }
    }
  </style>
</head>
<body>

<div class="game-wrapper">
  <button class="fs-btn" onclick="toggleFullscreen()">FULLSCREEN ⛶</button>

  <div class="felt-table">
    <!-- WHEEL -->
    <div class="wheel-container">
      <canvas id="roulette-canvas" width="320" height="320"></canvas>
    </div>

    <!-- RIGHT CONTENT: HUD + BETTING GRID -->
    <div class="table-right">
      <!-- HUD PANEL -->
      <div class="hud-panel">
        <div class="hud-title">CURRENT BALANCE</div>
        <div class="hud-balance" id="balance-val">$1,518,049</div>
        <div class="hud-stats">
          <span>WIN: <strong id="win-val" style="color:#4ade80;">$0</strong></span>
          <span>BET: <strong id="bet-val" style="color:#fde047;">$0</strong></span>
        </div>
      </div>

      <!-- BETTING GRID -->
      <div class="betting-grid">
        <div class="grid-row">
          <div class="cell doz" onclick="placeBet('1st12', '1ST 12', this)">1ST 12</div>
          <div class="cell doz" onclick="placeBet('2nd12', '2ND 12', this)">2ND 12</div>
          <div class="cell doz" onclick="placeBet('3rd12', '3RD 12', this)">3RD 12</div>
        </div>

        <div style="display: flex; gap: 2px;">
          <div class="cell zero" onclick="placeBet('number', 0, this)">0</div>
          <div style="display:flex; flex-direction:column; gap:2px;">
            <!-- ROW 3 (3 to 36) -->
            <div class="grid-row" id="row-3"></div>
            <!-- ROW 2 (2 to 35) -->
            <div class="grid-row" id="row-2"></div>
            <!-- ROW 1 (1 to 34) -->
            <div class="grid-row" id="row-1"></div>
          </div>
        </div>

        <div class="grid-row" style="margin-top:2px;">
          <div class="cell outside" onclick="placeBet('1to18', '1TO18', this)">1 TO 18</div>
          <div class="cell outside" onclick="placeBet('even', 'EVEN', this)">EVEN</div>
          <div class="cell outside red" onclick="placeBet('red', 'RED', this)">RED</div>
          <div class="cell outside black" onclick="placeBet('black', 'BLACK', this)">BLACK</div>
          <div class="cell outside" onclick="placeBet('odd', 'ODD', this)">ODD</div>
          <div class="cell outside" onclick="placeBet('19to36', '19TO36', this)">19 TO 36</div>
        </div>
      </div>

      <!-- CHIP SELECTOR -->
      <div class="chip-rack">
        <div class="chip chip-100 selected" onclick="selectChip(100, this)">100</div>
        <div class="chip chip-50" onclick="selectChip(50, this)">50</div>
        <div class="chip chip-500" onclick="selectChip(500, this)">500</div>
        <div class="chip chip-1000" onclick="selectChip(1000, this)">1000</div>
        <div class="chip chip-5000" onclick="selectChip(5000, this)">5000</div>
      </div>
    </div>
  </div>

  <!-- BOTTOM ACTION BAR -->
  <div class="action-bar">
    <button class="arc-btn btn-spin" onclick="spinWheel()">PLAY AGAIN</button>
    <button class="arc-btn btn-clear" onclick="clearBets()">CLEAR</button>
    <button class="arc-btn btn-lobby" onclick="alert('Lobby')">LOBBY 🚪</button>
  </div>
</div>

<script>
const socket = io();
let currentChipVal = 100;
let totalBetAmount = 0;

const RED_NUMBERS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
const WHEEL_NUMBERS = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];

// Build 1-36 Numbers Table Layout
const r3 = document.getElementById('row-3');
const r2 = document.getElementById('row-2');
const r1 = document.getElementById('row-1');

for (let col = 1; col <= 12; col++) {
  const n3 = col * 3;
  const n2 = col * 3 - 1;
  const n1 = col * 3 - 2;

  createCell(r3, n3);
  createCell(r2, n2);
  createCell(r1, n1);
}

function createCell(rowEl, num) {
  const cell = document.createElement('div');
  cell.className = `cell num ${RED_NUMBERS.includes(num) ? 'red' : 'black'}`;
  cell.innerText = num;
  cell.onclick = () => placeBet('number', num, cell);
  rowEl.appendChild(cell);
}

function selectChip(val, el) {
  currentChipVal = val;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

function placeBet(type, target, el) {
  socket.emit('roulette_place_bet', { type, target, amount: currentChipVal });
  totalBetAmount += currentChipVal;
  document.getElementById('bet-val').innerText = `$${totalBetAmount}`;

  const chip = document.createElement('div');
  chip.className = 'placed-chip';
  chip.innerText = currentChipVal;
  el.appendChild(chip);
}

function clearBets() {
  socket.emit('roulette_clear_bets');
}

socket.on('bets_cleared', () => {
  totalBetAmount = 0;
  document.getElementById('bet-val').innerText = '$0';
  document.querySelectorAll('.placed-chip').forEach(c => c.remove());
});

socket.on('balance_update', bal => {
  document.getElementById('balance-val').innerText = `$${Math.floor(bal).toLocaleString()}`;
});

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

/* ====================================================================
   HIGH-PRECISION 2D ARCADE CANVAS WHEEL ENGINE (IMAGE #3 MATCH)
   ==================================================================== */
const canvas = document.getElementById('roulette-canvas');
const ctx = canvas.getContext('2d');
const cx = canvas.width / 2;
const cy = canvas.height / 2;

let wheelAngle = 0;
let ballAngle = 0;
let ballRadius = 125;

function renderArcadeWheel() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Outer Mahogany Rim
  ctx.beginPath(); ctx.arc(cx, cy, 155, 0, Math.PI * 2);
  ctx.fillStyle = '#42220b'; ctx.fill();

  // Brass Trim
  ctx.beginPath(); ctx.arc(cx, cy, 145, 0, Math.PI * 2);
  ctx.fillStyle = '#d97706'; ctx.fill();

  const slices = WHEEL_NUMBERS.length;
  const step = (Math.PI * 2) / slices;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(wheelAngle);

  for (let i = 0; i < slices; i++) {
    const a = i * step;
    const num = WHEEL_NUMBERS[i];

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 138, a, a + step);
    ctx.fillStyle = num === 0 ? '#047857' : (RED_NUMBERS.includes(num) ? '#b91c1c' : '#111827');
    ctx.fill();
    ctx.strokeStyle = '#d97706'; ctx.lineWidth = 1; ctx.stroke();

    // Numbers
    ctx.save();
    ctx.rotate(a + step / 2);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px Inter';
    ctx.fillText(num, 115, 3);
    ctx.restore();
  }

  // Golden Center Spindle with Handles (Image #3 Style)
  ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2);
  ctx.fillStyle = '#b45309'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, 42, 0, Math.PI * 2);
  ctx.fillStyle = '#f59e0b'; ctx.fill();

  // Spindle Cross Handles
  for (let h = 0; h < 4; h++) {
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#78350f';
    ctx.fillRect(0, -4, 38, 8);
    ctx.beginPath(); ctx.arc(38, 0, 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // Marble Ball
  ctx.save();
  ctx.translate(cx, cy);
  const bx = Math.cos(ballAngle) * ballRadius;
  const by = Math.sin(ballAngle) * ballRadius;
  ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 6; ctx.fill();
  ctx.restore();
}

renderArcadeWheel();

function spinWheel() {
  socket.emit('roulette_spin_request');
}

socket.on('roulette_spin_start', data => {
  const start = performance.now();
  const duration = 6000;

  function anim(time) {
    const elapsed = time - start;
    const progress = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);

    wheelAngle += 0.04 * (1 - ease);
    ballAngle -= 0.16 * (1 - ease);
    ballRadius = progress > 0.6 ? 125 - (80 * ((progress - 0.6) / 0.4)) : 125;

    renderArcadeWheel();
    if (progress < 1) requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
});

socket.on('roulette_result', res => {
  setTimeout(() => {
    document.getElementById('win-val').innerText = `$${res.payout}`;
    totalBetAmount = 0;
    document.getElementById('bet-val').innerText = '$0';
    document.querySelectorAll('.placed-chip').forEach(c => c.remove());
  }, 500);
});
</script>
</body>
</html>
